{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h1 class="text-2xl font-bold mb-6">Sửa bài viết</h1>
<form method="post" class="bg-white p-6 rounded shadow space-y-4">
    <div>
        <label class="block font-medium">Tiêu đề</label>
        <input type="text" name="title" value="{{ post.title }}" class="w-full border rounded px-3 py-2">
    </div>
    <div>
        <label class="block font-medium">Mô tả ngắn</label>
        <textarea name="short_description" rows="2" class="w-full border rounded px-3 py-2">{{ post.short_description }}</textarea>
    </div>
    <div>
        <label class="block font-medium">Nội dung (HTML)</label>
        <textarea name="content" rows="15" class="w-full border rounded px-3 py-2 font-mono text-sm">{{ post.content }}</textarea>
    </div>
    <div class="grid md:grid-cols-2 gap-4">
        <div>
            <label>SEO Title</label>
            <input type="text" name="seo_title" value="{{ post.seo_title or '' }}" class="w-full border rounded px-3 py-2">
        </div>
        <div>
            <label>Meta Description</label>
            <input type="text" name="meta_description" value="{{ post.meta_description or '' }}" class="w-full border rounded px-3 py-2">
        </div>
    </div>
    <div>
        <label>Danh mục</label>
        <select name="category_id" class="w-full border rounded px-3 py-2">
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if post.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label>Trạng thái</label>
        <select name="status" class="w-full border rounded px-3 py-2">
            <option value="pending" {% if post.status=='pending' %}selected{% endif %}>Chờ duyệt</option>
            <option value="published" {% if post.status=='published' %}selected{% endif %}>Đã đăng</option>
            <option value="scheduled" {% if post.status=='scheduled' %}selected{% endif %}>Lên lịch</option>
        </select>
    </div>
    <div>
        <label class="flex items-center">
            <input type="checkbox" name="is_featured" {% if post.is_featured %}checked{% endif %} class="mr-2">
            Bài nổi bật
        </label>
    </div>
    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded">Lưu thay đổi</button>
</form>
{% endblock %}
