<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <form method="post" class="bg-white p-8 rounded shadow w-full max-w-sm">
        <h1 class="text-2xl font-bold mb-6 text-center">Đăng nhập Quản trị</h1>
        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}<p class="text-red-600 mb-4">{{ msg }}</p>{% endfor %}
        {% endwith %}
        <input type="text" name="username" placeholder="Tên đăng nhập" required class="w-full border rounded px-3 py-2 mb-4">
        <input type="password" name="password" placeholder="Mật khẩu" required class="w-full border rounded px-3 py-2 mb-4">
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded">Đăng nhập</button>
        <p class="text-xs text-gray-500 mt-4 text-center">Mặc định: admin / admin123 (đổi ngay)</p>
    </form>
</body>
</html>
